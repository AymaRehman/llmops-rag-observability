apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
  namespace: rag
  labels: { app: rag-api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: rag-api }
  template:
    metadata:
      labels: { app: rag-api }
    spec:
      initContainers:
        - name: wait-for-collection
          image: curlimages/curl:latest
          command: ["/bin/sh", "-c"]
          args:
            - until curl -sf http://qdrant:6333/collections/knowledge_base > /dev/null; do echo "waiting for knowledge_base..."; sleep 5; done
      containers:
        - name: api
          image: rag-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: rag-config }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /metrics, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /metrics, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rag-api
  namespace: rag
spec:
  selector: { app: rag-api }
  ports:
    - port: 8000
      targetPort: 8000
